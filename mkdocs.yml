site_name: SEARN Platform — Pilot User Guide
site_description: Pilot user guide for the SEARN Capacity Building Platform.
site_url: https://docs.searn-lms.titaned.com/

theme:
  name: material
  logo: img/logo.png
  favicon: img/logo.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Quick How-tos: how-tos.md
  - Getting Started:
      - Before You Begin: before-you-begin.md
      - Logging In: logging-in.md
  - Roles:
      - SEARN Secretariat: secretariat.md
      - NRA Admin / Leadership: nra-admin.md
      - NRA Manager: nra-manager.md
      - NRA Staff: nra-staff.md
  - Give Feedback: feedback-form/index.html
